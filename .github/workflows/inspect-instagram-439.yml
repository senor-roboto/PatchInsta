name: Inspect Instagram 439 real DEX

on:
  push:
    branches: [fix/instagram-439-real-dex-4.1.6]
    paths:
      - .github/workflows/inspect-instagram-439.yml
      - scripts/inspect_instagram_439.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DEX inspector
        run: python -m pip install --disable-pip-version-check 'androguard==4.1.3'
      - name: Download public Instagram 439 arm64 reference APK
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            'https://github.com/thunderkex/revanced-extended/releases/download/latest-build/instagram-ex-revanced-v439.0.0.37.89-arm64-v8a.apk' \
            --output /tmp/instagram-439.apk
          echo '8b129b179169bb9e49937cb20481ee6c8d30d64261d7850308d8619698df5802  /tmp/instagram-439.apk' | sha256sum -c -
      - name: Dump RoundedCornerFrameLayout dispatchDraw with operands and references
        run: |
          python scripts/inspect_instagram_439.py /tmp/instagram-439.apk | tee instagram-439-dex.txt
      - name: Preserve exact DEX evidence
        uses: actions/upload-artifact@v4
        with:
          name: instagram-439-dex
          path: instagram-439-dex.txt
          if-no-files-found: error
          retention-days: 14
