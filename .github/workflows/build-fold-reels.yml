name: Build PatchInsta validation candidate

on:
  push:
    branches: [main, fix/rounded-dispatch-4.1.7, fix/litho-runtime-4.1.8, codex/fold-reels-4.1.9]
    paths:
      - piko-fold-reels.patch
      - release.json
      - scripts/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read this patch kit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned upstream Piko sources
        uses: actions/checkout@v4
        with:
          repository: crimera/piko
          ref: 50744aa07bb41c4e1f942a06614ef4e6f2e3610c
          path: upstream
          persist-credentials: false
      - name: Apply the reviewed source patch
        run: |
          python3 - <<'PY'
          import json, subprocess
          config=json.load(open('release.json'))
          actual=subprocess.check_output(['git','-C','upstream','rev-parse','HEAD'],text=True).strip()
          assert actual == config['upstream_commit'], 'Upstream pin mismatch'
          PY
          git -C upstream apply --check ../piko-fold-reels.patch
          git -C upstream apply ../piko-fold-reels.patch
          git -C upstream diff --check
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check policy, mappings and distribution guards
        run: |
          mkdir -p upstream/tests/fold-reels/build
          javac -d upstream/tests/fold-reels/build \
            upstream/extensions/instagram/src/main/java/app/morphe/extension/instagram/patches/reels/FoldReelsPolicy.java \
            upstream/extensions/instagram/src/main/java/app/morphe/extension/instagram/patches/reels/FoldReelsGeometry.java \
            upstream/tests/fold-reels/FoldReelsPolicyTest.java
          java -cp upstream/tests/fold-reels/build FoldReelsPolicyTest
          python3 upstream/tests/fold-reels/check_mappings.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run Android scenarios, compile MPP and load it with Morphe
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:instagram:testReleaseUnitTest :patches:verifyFoldBundle --no-daemon --console=plain
      - name: Check every test report, bundle identity, ZIP and SHA-256
        run: python3 scripts/bundle.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            upstream/extensions/instagram/build/test-results/testReleaseUnitTest/
            upstream/extensions/instagram/build/reports/tests/testReleaseUnitTest/
            upstream/patches/build/test-results/test/
            output/test-results.json
          retention-days: 30
      - name: Upload candidate kit for device validation
        uses: actions/upload-artifact@v4
        with:
          name: PatchInsta-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 30

