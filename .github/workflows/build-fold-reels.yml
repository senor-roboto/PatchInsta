name: Build experimental Fold Reels

on:
  push:
    branches: [main]
    paths:
      - piko-fold-reels.patch
      - .github/workflows/build-fold-reels.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read this patch kit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read pinned upstream Piko sources
        uses: actions/checkout@v4
        with:
          repository: crimera/piko
          ref: 50744aa07bb41c4e1f942a06614ef4e6f2e3610c
          path: upstream
          persist-credentials: false

      - name: Apply the reviewed source patch
        working-directory: upstream
        run: |
          git apply --check ../piko-fold-reels.patch
          git apply ../piko-fold-reels.patch
          git diff --check

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check policy and mappings
        working-directory: upstream
        run: |
          mkdir -p tests/fold-reels/build
          javac -d tests/fold-reels/build \
            extensions/instagram/src/main/java/app/morphe/extension/instagram/patches/reels/FoldReelsPolicy.java \
            extensions/instagram/src/main/java/app/morphe/extension/instagram/patches/reels/FoldReelsGeometry.java \
            tests/fold-reels/FoldReelsPolicyTest.java
          java -cp tests/fold-reels/build FoldReelsPolicyTest
          python3 tests/fold-reels/check_mappings.py

      - name: Compile the Android patch bundle
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:instagram:testReleaseUnitTest :patches:verifyFoldBundle --no-daemon --console=plain

      - name: Summarize Android view regression tests
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('upstream/extensions/instagram/build/test-results/testReleaseUnitTest').glob('TEST-*FoldReels*Test.xml'))
          if len(reports) != 5:
              raise SystemExit('Expected Fold Reels Android regression report')
          for report in reports:
              suite = ET.parse(report).getroot()
              print('Fold Reels Android view scenarios:', suite.attrib)
              if int(suite.attrib['failures']) or int(suite.attrib['errors']) or int(suite.attrib['skipped']):
                  raise SystemExit('Android regression scenarios did not all pass')
          PYTEST


      - name: Inspect compiled bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          bundle = list(Path('upstream/patches/build/libs').glob('*.mpp'))
          assert len(bundle) == 1
          with ZipFile(bundle[0]) as z:
              print(z.read('META-INF/MANIFEST.MF').decode())
              print([n for n in z.namelist() if n.endswith(('.rve','.dex'))])
          PY
