name: Promote physically validated PatchInsta 4.1.9

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Actions run ID that produced the tested PatchInsta candidate
        required: true
        type: string
      mpp_sha256:
        description: SHA-256 copied from the candidate kit's SHA256SUMS.txt
        required: true
        type: string
      validation_evidence:
        description: JSON physical device validation attestation (schema documented in RELEASE-GATE-4.1.9.md)
        required: true
        type: string

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: patchinsta-promotion-4.1.9
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the exact candidate run
        uses: actions/download-artifact@v4
        with:
          name: PatchInsta-${{ github.event.inputs.candidate_run_id }}
          run-id: ${{ github.event.inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output
      - name: Write supplied device attestation
        env:
          VALIDATION_EVIDENCE: ${{ github.event.inputs.validation_evidence }}
        run: python3 -c "import os; open('validation-evidence.json','w',encoding='utf-8').write(os.environ['VALIDATION_EVIDENCE'])"
      - name: Verify attestation and promote the exact MPP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ github.event.inputs.candidate_run_id }}
          EXPECTED_MPP_SHA256: ${{ github.event.inputs.mpp_sha256 }}
        run: python3 scripts/publish.py --promote --evidence validation-evidence.json
      - name: Preserve the promotion record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-record-${{ github.run_id }}
          path: |
            publication-result.json
            validation-evidence.json
          if-no-files-found: ignore
          retention-days: 90

