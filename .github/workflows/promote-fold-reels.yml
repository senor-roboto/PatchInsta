name: Publish verified PatchInsta 4.1.10

on:
  push:
    branches: [main]
    paths: [validation/release-4.1.10.json]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Actions run ID that produced the tested PatchInsta candidate
        required: true
        type: string
      mpp_sha256:
        description: SHA-256 copied from the candidate kit's SHA256SUMS.txt
        required: true
        type: string
      validation_evidence:
        description: Optional JSON attestation; otherwise use the checked-in user-authorized offline validation record
        required: false
        type: string

permissions:
  contents: write
  actions: read
  packages: read

concurrency:
  group: patchinsta-promotion-4.1.10
  cancel-in-progress: false

jobs:
  promote:
    # One delivery only: the currently authorized main transition. Later pushes
    # cannot satisfy this predecessor guard. Manual retries remain explicit.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.before == '9914eeeb2c24d338657ab0ef7539509ed6742241')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check publication guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Download the exact candidate run
        uses: actions/download-artifact@v4
        with:
          name: PatchInsta-${{ github.event.inputs.candidate_run_id || '37019425034' }}
          run-id: ${{ github.event.inputs.candidate_run_id || '37019425034' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output
      - name: Select truthful publication evidence
        env:
          VALIDATION_EVIDENCE: ${{ github.event.inputs.validation_evidence }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          supplied = os.environ['VALIDATION_EVIDENCE']
          record = supplied or pathlib.Path('validation/release-4.1.10.json').read_text()
          pathlib.Path('validation-evidence.json').write_text(record, encoding='utf-8')
          PY
      - name: Verify evidence and publish the exact MPP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ github.event.inputs.candidate_run_id || '37019425034' }}
          EXPECTED_MPP_SHA256: ${{ github.event.inputs.mpp_sha256 || '57bc649d7e8aa06aae88ead012f4778911aeca0764dce02d1294a921e922ee23' }}
        run: python3 scripts/publish.py --promote --evidence validation-evidence.json
      - name: Preserve the promotion record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-record-${{ github.run_id }}
          path: |
            publication-result.json
            validation-evidence.json
          if-no-files-found: ignore
          retention-days: 90
